name: Production incident diagnostics (read-only)

on:
  push:
    branches: [fix/production-500-20260926]
    paths: [.github/workflows/incident-500-readonly.yml]

permissions:
  contents: read

concurrency:
  group: incident-500-readonly
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only fallback diagnostics
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_CO_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_CO_USER }}
          DEPLOY_KEY: ${{ secrets.HETZNER_CO_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.HETZNER_CO_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY"
          key="$RUNNER_TEMP/incident-deploy-key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          unset DEPLOY_KEY
          ssh -i "$key" -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/incident-known-hosts" \
            -o LogLevel=ERROR "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /var/www/aiwholesail-api && node -' <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const axios = require('axios');
          const dotenv = require('dotenv');
          const emit = (label, data) => console.log(label + ': ' + JSON.stringify(data));
          const fileEnv = dotenv.parse(fs.readFileSync('.env'));
          let bootEnv = {};
          try {
            const pid = cp.execFileSync('systemctl', ['show', '-p', 'MainPID', '--value', 'aiwholesail-api'], {encoding: 'utf8'}).trim();
            if (!/^\d+$/.test(pid) || pid === '0') throw new Error('no running service');
            const raw = cp.execFileSync('sudo', ['-n', 'cat', `/proc/${pid}/environ`], {encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe']});
            bootEnv = Object.fromEntries(raw.split('\0').filter(Boolean).map(x => [x.slice(0, x.indexOf('=')), x.slice(x.indexOf('=') + 1)]));
          } catch (_) {
            emit('runtime_environment', {available: false});
          }
          const effective = {...fileEnv, ...bootEnv};
          function classify(body) {
            const text = JSON.stringify(body);
            const patterns = {
              invalid_key: /invalid.{0,20}(?:api.?key|token)|(?:api.?key|token).{0,20}invalid/i,
              out_of_credits: /(?:out of|not enough|insufficient|no more|exhausted).{0,30}credits|credits.{0,30}(?:exhausted|limit reached)/i,
              not_subscribed: /not subscribed|unsubscribed|inactive account|account.{0,20}inactive/i,
              rate_limited: /rate.?limit|too many requests|quota exceeded/i,
              upstream_request_failed: /Zillow API request failed/i
            };
            return Object.keys(patterns).filter(k => patterns[k].test(text));
          }
          (async () => {
            emit('checked_at', new Date().toISOString());
            if (effective.SCRAPE_DO_API_TOKEN) {
              try {
                const r = await axios.get('https://api.scrape.do/info', {
                  params: {token: effective.SCRAPE_DO_API_TOKEN.trim()},
                  timeout: 15000, maxRedirects: 0, validateStatus: () => true
                });
                const out = {status: r.status, classifications: classify(r.data)};
                for (const k of ['IsActive', 'ConcurrentRequest', 'MaxMonthlyRequest', 'RemainingConcurrentRequest', 'RemainingMonthlyRequest']) {
                  if (typeof r.data?.[k] === 'number' || typeof r.data?.[k] === 'boolean') out[k] = r.data[k];
                }
                emit('scrapedo_account', out);
              } catch (_) { emit('scrapedo_account', {request_failed: true}); }
            }
            const proxyUrl = effective.ZILLOW_PROXY_URL || 'http://127.0.0.1:3201/zillow';
            const parsed = new URL(proxyUrl);
            if (!['127.0.0.1', 'localhost', '[::1]'].includes(parsed.hostname)) {
              emit('legacy_fallback', {skipped: 'nonlocal_configuration'});
            } else if (!effective.ZILLOW_PROXY_SECRET) {
              emit('legacy_fallback', {skipped: 'secret_not_configured'});
            } else {
              try {
                const r = await axios.post(proxyUrl, {action: 'search', searchParams: {location: 'Denver, CO', page: 1}}, {
                  headers: {'Content-Type': 'application/json', 'x-api-key': effective.ZILLOW_PROXY_SECRET},
                  timeout: 25000, maxRedirects: 0, validateStatus: () => true
                });
                emit('legacy_fallback', {status: r.status, success: r.data?.success === true, classifications: classify(r.data)});
              } catch (_) { emit('legacy_fallback', {request_failed: true}); }
            }
          })().catch(() => { emit('diagnostic', {failed: true}); process.exitCode = 1; });
          NODE
