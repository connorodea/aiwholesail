name: Production incident diagnostics (read-only)

on:
  push:
    branches: [fix/production-500-20260926]
    paths: [.github/workflows/incident-500-readonly.yml]

permissions:
  contents: read

concurrency:
  group: incident-500-readonly
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only production diagnostics
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_CO_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_CO_USER }}
          DEPLOY_KEY: ${{ secrets.HETZNER_CO_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.HETZNER_CO_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY"
          key="$RUNNER_TEMP/incident-deploy-key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          unset DEPLOY_KEY
          ssh -i "$key" -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/incident-known-hosts" \
            -o LogLevel=ERROR "$DEPLOY_USER@$DEPLOY_HOST" 'python3 -' <<'PYTHON'
          """Read-only production diagnostics. Never print raw logs or secrets."""
          import datetime
          import json
          import os
          import re
          import shutil
          import subprocess

          def run(args, timeout=20):
              try:
                  result = subprocess.run(args, capture_output=True, text=True, timeout=timeout)
                  return result.returncode, result.stdout, result.stderr
              except (OSError, subprocess.TimeoutExpired) as error:
                  return 125, '', type(error).__name__

          def emit(label, data):
              print(label + ': ' + json.dumps(data, sort_keys=True), flush=True)

          emit('checked_at', datetime.datetime.now(datetime.timezone.utc).isoformat())
          for url in ('https://aiwholesail.com/', 'https://aiwholesail.com/login',
                      'https://api.aiwholesail.com/health', 'http://127.0.0.1:3202/health'):
              code, out, _ = run(['curl', '--silent', '--connect-timeout', '5', '--max-time', '15',
                                  '--output', '/dev/null', '--write-out', '%{http_code}', url])
              emit('http', {'url': url, 'curl_exit': code, 'status': out.strip()})
          code, out, _ = run(['curl', '--silent', '--connect-timeout', '5', '--max-time', '15',
                              '--resolve', 'aiwholesail.com:443:127.0.0.1', '--output', '/dev/null',
                              '--write-out', '%{http_code}', 'https://aiwholesail.com/'])
          emit('origin_https', {'curl_exit': code, 'status': out.strip()})
          for service in ('nginx', 'aiwholesail-api'):
              code, out, _ = run(['systemctl', 'is-active', service])
              state = out.strip()
              emit('service', {'name': service, 'state': state if state in
                              ('active', 'inactive', 'failed', 'activating', 'deactivating', 'unknown') else 'unavailable'})
          usage = shutil.disk_usage('/')
          stat = os.statvfs('/')
          emit('filesystem', {'used_percent': round(100 * usage.used / usage.total, 1),
                              'free_bytes': usage.free,
                              'inode_used_percent': round(100 * (stat.f_files - stat.f_ffree) / stat.f_files, 1)
                              if stat.f_files else None})
          for path in ('/var/www/aiwholesail.com/index.html', '/var/www/aiwholesail/dist/index.html'):
              data = {'path': path, 'exists': os.path.isfile(path)}
              if data['exists']:
                  info = os.stat(path)
                  data.update(size=info.st_size, mode=oct(info.st_mode & 0o777))
                  code, _, _ = run(['sudo', '-n', '-u', 'www-data', 'test', '-r', path])
                  data['www_data_readable'] = code == 0
              emit('frontend_entrypoint', data)
          code, _, _ = run(['sudo', '-n', 'nginx', '-t'])
          emit('nginx_config_test', {'passed': code == 0, 'exit_code': code})
          patterns = {
              'internal_redirect_cycle': r'rewrite or internal redirection cycle',
              'permission_denied': r'permission denied',
              'disk_full': r'no space left on device',
              'upstream_timeout': r'upstream timed out',
              'connection_refused': r'connection refused|ECONNREFUSED',
              'missing_module': r'cannot find module|MODULE_NOT_FOUND',
              'database_connection': r'remaining connection slots|too many clients|terminating connection',
              'missing_relation': r'relation .{0,100} does not exist',
              'missing_column': r'column .{0,100} does not exist',
              'zillow_failure': r'Zillow API request failed',
              'scrapingbee_mentioned': r'ScrapingBee',
              'scrapedo_mentioned': r'scrape\.do',
              'upstream_401': r'(?:status(?: code)?|HTTP)[ :]+401',
              'upstream_429': r'(?:status(?: code)?|HTTP)[ :]+429',
              'upstream_500': r'(?:status(?: code)?|HTTP)[ :]+500',
          }
          checks = [('nginx_recent', ['sudo', '-n', 'tail', '-n', '300', '/var/log/nginx/error.log']),
                    ('api_last_2_hours', ['sudo', '-n', 'journalctl', '-u', 'aiwholesail-api',
                                         '--since', '2 hours ago', '--no-pager', '-n', '400', '-o', 'cat'])]
          for label, args in checks:
              code, logs, _ = run(args)
              if label == 'nginx_recent':
                  logs = '\n'.join(line for line in logs.splitlines() if 'aiwholesail.com' in line)
              emit(label, {'read_exit': code, 'sample_lines': len(logs.splitlines()),
                           'counts': {name: len(re.findall(pattern, logs, re.I))
                                      for name, pattern in patterns.items() if re.search(pattern, logs, re.I)}})
          PYTHON
