name: Production incident diagnostics (read-only)

on:
  push:
    branches: [fix/production-500-20260926]
    paths: [.github/workflows/incident-500-readonly.yml]

permissions:
  contents: read

concurrency:
  group: incident-500-readonly
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only provider diagnostics
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_CO_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_CO_USER }}
          DEPLOY_KEY: ${{ secrets.HETZNER_CO_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.HETZNER_CO_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY"
          key="$RUNNER_TEMP/incident-deploy-key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          unset DEPLOY_KEY
          ssh -i "$key" -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/incident-known-hosts" \
            -o LogLevel=ERROR "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /var/www/aiwholesail-api && node -' <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const axios = require('axios');
          const dotenv = require('dotenv');
          const emit = (label, data) => console.log(label + ': ' + JSON.stringify(data));
          const fileEnv = dotenv.parse(fs.readFileSync('.env'));
          let bootEnv = {};
          try {
            const pid = cp.execFileSync('systemctl', ['show', '-p', 'MainPID', '--value', 'aiwholesail-api'], {encoding: 'utf8'}).trim();
            if (!/^\d+$/.test(pid) || pid === '0') throw new Error('no running service');
            const raw = cp.execFileSync('sudo', ['-n', 'cat', `/proc/${pid}/environ`], {encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe']});
            bootEnv = Object.fromEntries(raw.split('\0').filter(Boolean).map(x => [x.slice(0, x.indexOf('=')), x.slice(x.indexOf('=') + 1)]));
          } catch (_) {
            emit('runtime_environment', {available: false});
          }
          const effective = {...fileEnv, ...bootEnv};
          const effectiveKey = effective.SCRAPINGBEE_API_KEY || '';
          emit('configuration', {
            provider: ['scrapedo', 'scrape.do', 'scrapingbee'].includes(effective.SCRAPER_PROVIDER) ? effective.SCRAPER_PROVIDER : 'automatic',
            bee_key_present: Boolean(effectiveKey),
            bee_key_has_outer_whitespace: effectiveKey !== effectiveKey.trim(),
            bee_env_override: Boolean(bootEnv.SCRAPINGBEE_API_KEY),
            bee_file_key_differs: Boolean(fileEnv.SCRAPINGBEE_API_KEY && effectiveKey !== fileEnv.SCRAPINGBEE_API_KEY),
            scrapedo_key_present: Boolean(effective.SCRAPE_DO_API_TOKEN),
            rapidapi_key_present: Boolean(effective.RAPIDAPI_KEY)
          });
          function classify(text) {
            const patterns = {
              invalid_key: /invalid.{0,20}(?:api.?key|token)|(?:api.?key|token).{0,20}invalid/i,
              out_of_credits: /(?:out of|not enough|insufficient|no more|exhausted).{0,30}credits|credits.{0,30}(?:exhausted|limit reached)/i,
              not_subscribed: /not subscribed|unsubscribed|inactive account|account.{0,20}inactive/i,
              rate_limited: /rate.?limit|too many requests|quota exceeded/i
            };
            return Object.keys(patterns).filter(k => patterns[k].test(text));
          }
          async function usage(label, key) {
            if (!key) return;
            try {
              const response = await axios.get('https://app.scrapingbee.com/api/v1/usage', {
                headers: {Authorization: `Bearer ${key.trim()}`}, timeout: 15000,
                maxRedirects: 0, validateStatus: () => true
              });
              const body = response.data;
              const out = {status: response.status, classifications: classify(JSON.stringify(body))};
              if (body && typeof body === 'object') {
                for (const name of ['max_api_credit', 'used_api_credit', 'max_concurrency', 'current_concurrency']) {
                  if (typeof body[name] === 'number') out[name] = body[name];
                }
              }
              emit(label, out);
            } catch (_) { emit(label, {request_failed: true}); }
          }
          (async () => {
            emit('checked_at', new Date().toISOString());
            await usage('scrapingbee_effective_key_usage', effectiveKey);
            if (fileEnv.SCRAPINGBEE_API_KEY && fileEnv.SCRAPINGBEE_API_KEY !== effectiveKey) {
              await usage('scrapingbee_file_key_usage', fileEnv.SCRAPINGBEE_API_KEY);
            }
            try {
              const logs = cp.execFileSync('sudo', ['-n', 'journalctl', '-u', 'aiwholesail-api', '--since', '30 minutes ago', '--no-pager', '-n', '400', '-o', 'cat'], {encoding:'utf8', stdio:['ignore','pipe','pipe']});
              const summary = {};
              for (const line of logs.split('\n')) {
                const tags = classify(line);
                const status = line.match(/(?:HTTP|status(?: code)?)[ :]+([45][0-9]{2})/i);
                const provider = /scrapingbee/i.test(line) ? 'scrapingbee' : /scrape\.do/i.test(line) ? 'scrapedo' : /rapidapi/i.test(line) ? 'rapidapi' : 'other';
                if (status || tags.length) {
                  const key = JSON.stringify({provider, status: status ? Number(status[1]) : null, tags});
                  summary[key] = (summary[key] || 0) + 1;
                }
              }
              emit('recent_provider_error_classes', Object.entries(summary).map(([key,count]) => ({...JSON.parse(key),count})));
            } catch (_) { emit('recent_provider_error_classes', {available: false}); }
          })().catch(() => { emit('diagnostic', {failed: true}); process.exitCode = 1; });
          NODE
